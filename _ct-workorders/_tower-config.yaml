# Tower Config — better-agent-terminal (project layer)
# 建立時間:2026-04-11 09:55 (UTC+8)
# 載入優先級:session > project (本檔) > global > 預設

# 工單派發後自動開新 session 的行為
# on    = 靜默自動執行(偵測不到分頁能力時降級到剪貼簿)
# ask   = 互動式提問 [A/B/C]
# off   = 只顯示文字提示
# yolo  = on 超集,Worker 自動送出 + 塔台自主決策下一張(PLAN-020 dogfood)
# 2026-04-25 18:04 改為 off：upstream sync Phase 1 期間塔台需顯示驗收清單等使用者決策，避免 yolo 鏈式派發
# 2026-04-26 00:25 改為 on：PLAN-007 Phase B worktree 階段恢復自動派發（塔台 D 模式 pause 仍生效，session 內 yolo 覆寫個別工單）
auto-session: on

# YOLO 斷點 B 閾值(Renew ≥N 或連續 N FAILED 觸發暫停)
# 0 = 停用斷點 B / 預設 3 / dogfood 期間用 1 盡早觸發觀察
yolo_max_retries: 1

# 需求對齊最少提問輪數(0 關閉)
alignment-rounds: 3

# 選項式提問開關
interactive-prompts: on

# 經驗等級
experience-level: standard

# 工單派發摘要詳細程度
verbose: on

# 跨專案協調工單前綴(空=不啟用)
project-prefix: ""

# === v4.0 新增選項 ===

# BUG 單據追蹤（*bug 命令）
enable_bug_tracking: true

# PLAN 單據追蹤（*plan 命令）
enable_plan_tracking: true

# EXP 實驗追蹤（*exp 命令）
enable_experiments: true

# 歸檔天數門檻（*archive 判定用）
# 2026-04-18 調整：1 → 7（dogfood 結束恢復保守設定，避免與 PLAN IDEA 節點活躍引用衝突過度頻繁觸發，見 L066）
# 2026-04-20 調整：7 → 2（第十六 session *sync 發現 7 天門檻下 0 候選，熱區累積 73+17+19；對齊第十五 session 歷史 + 本專案 session 密度高，見 D072）
archive_days: 2

# *sync 後提示歸檔候選
auto_archive_prompt: off

# 研究型工單是否允許 Worker 互動
research_interaction: true

# 研究型工單 Worker 每次提問上限
research_max_questions: 3

# 小變動自主 commit 行為（on/ask/off）
# 2026-04-18 16:50 改為 on（session 收尾期間塔台 meta 變更頻繁，降低打擾）
auto_commit: on

# 自主 commit 訊息格式模板
auto_commit_format: "chore: {description} ({scope})"
