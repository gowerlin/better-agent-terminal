name: Build Server Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plan-007-remote-dev
    tags:
      - server-bundle-v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs_on: ubuntu-22.04
            artifact_name: server-bundle-linux-x64
          - target: linux-arm64
            runs_on: ubuntu-22.04-arm
            artifact_name: server-bundle-linux-arm64
          - target: darwin-arm64
            runs_on: macos-14
            artifact_name: server-bundle-darwin-arm64
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required native modules present
        run: node scripts/verify-native-modules.js

      - name: Build server bundle
        run: node scripts/build-server-bundle.mjs --target=${{ matrix.target }}

      - name: Verify server bundle
        run: node scripts/verify-server-bundle.js --target=${{ matrix.target }}

      - name: Upload server bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: dist-server/bat-server-${{ matrix.target }}-v*.tar.gz

  release:
    name: Publish server bundle release
    if: startsWith(github.ref, 'refs/tags/server-bundle-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-server
          merge-multiple: true

      - name: Verify release bundles
        run: node scripts/verify-server-bundle.js

      - name: Create server bundle release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          files: dist-server/bat-server-*.tar.gz
