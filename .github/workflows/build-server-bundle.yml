name: Build Server Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plan-007-remote-dev
    tags:
      - server-bundle-v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs_on: ubuntu-22.04
            artifact_name: server-bundle-linux-x64
          - target: linux-arm64
            runs_on: ubuntu-22.04-arm
            artifact_name: server-bundle-linux-arm64
          - target: darwin-arm64
            runs_on: macos-14
            artifact_name: server-bundle-darwin-arm64
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required native modules present
        run: node scripts/verify-native-modules.js

      - name: Build server bundle
        run: node scripts/build-server-bundle.mjs --target=${{ matrix.target }}

      - name: Verify server bundle
        run: node scripts/verify-server-bundle.js --target=${{ matrix.target }}

      - name: Upload server bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist-server/bat-server-${{ matrix.target }}-v*.tar.gz
            dist-server/bat-server-${{ matrix.target }}-v*.tar.gz.sha256

  manifest:
    name: Generate manifest.json
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Flatten artifacts into dist-server/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-server
          # Each artifact lands in staging/<artifact_name>/<files>; flatten to dist-server/
          find staging -type f \( -name 'bat-server-*.tar.gz' -o -name 'bat-server-*.tar.gz.sha256' \) -exec mv -v {} dist-server/ \;
          ls -la dist-server/

      - name: Parse version from tarball filename
        id: parse_version
        shell: bash
        run: |
          set -euo pipefail
          # Pick any one tarball; parse vX.Y.Z from filename pattern bat-server-<arch>-vX.Y.Z.tar.gz
          first=$(ls dist-server/bat-server-linux-x64-v*.tar.gz | head -n1)
          if [ -z "$first" ]; then
            echo "❌ No linux-x64 tarball found to parse version from" >&2
            exit 1
          fi
          version=$(basename "$first" | sed -E 's/^bat-server-linux-x64-v(.+)\.tar\.gz$/\1/')
          if [ -z "$version" ]; then
            echo "❌ Failed to parse version from $first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $version"

      - name: Generate manifest.json
        run: |
          node scripts/generate-server-bundle-manifest.mjs \
            --input-dir dist-server \
            --version ${{ steps.parse_version.outputs.version }} \
            --build-date ${{ steps.parse_version.outputs.build_date }} \
            --output dist-server/manifest.json

      - name: Verify release bundles
        run: node scripts/verify-server-bundle.js

      - name: Upload manifest + tarballs + sidecars
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle-release
          if-no-files-found: error
          path: |
            dist-server/bat-server-*.tar.gz
            dist-server/bat-server-*.tar.gz.sha256
            dist-server/manifest.json

  release:
    name: Publish server bundle release
    if: startsWith(github.ref, 'refs/tags/server-bundle-v')
    needs: [manifest]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: server-bundle-release
          path: dist-server

      - name: Verify release bundles
        run: node scripts/verify-server-bundle.js

      - name: Create server bundle release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          files: |
            dist-server/bat-server-linux-x64-v*.tar.gz
            dist-server/bat-server-linux-x64-v*.tar.gz.sha256
            dist-server/bat-server-linux-arm64-v*.tar.gz
            dist-server/bat-server-linux-arm64-v*.tar.gz.sha256
            dist-server/bat-server-darwin-arm64-v*.tar.gz
            dist-server/bat-server-darwin-arm64-v*.tar.gz.sha256
            dist-server/manifest.json
