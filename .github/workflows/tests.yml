name: Tests

# T0683 (BUG-168 / D177 step 1): trial run of the frontend / electron unit tests on ubuntu.
# T0685 (step 2): plus the tests under tests/ that vitest does not collect (`test:legacy`).
# T0686: also a reusable workflow. pre-release.yml / release.yml call it as their `tests` job
# and list that job in `build.needs` (Test gate, like the Typecheck gate): a failed test skips
# build and so release. Manual runs (workflow_dispatch) run the same definition.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Same install as the typecheck job (esbuild / rollup ship their binaries as optional platform
      # packages, node-pty uses its prebuilt), plus the one install script vitest needs: some test
      # files load modules that `require('electron')` unmocked, and without electron's postinstall
      # (path.txt + dist/) that require throws "Electron failed to install correctly".
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install the electron binary (electron's postinstall only)
        run: node node_modules/electron/install.js

      - name: Unit tests (vitest)
        id: unit
        env:
          # CLAUDE.md "遠端 Tower 通知": helper tests write their logs / data under these, never
          # the runner's real userData. Step level: a job-level `env` cannot use `runner`.
          BAT_HELPER_LOG_DIR: ${{ runner.temp }}/bat-helper-logs
          BAT_USER_DATA: ${{ runner.temp }}/bat-user-data
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-results.json"

      # Runs even when the unit tests failed, so one trial run reports both; the job still fails
      # when either step failed. scripts/run-legacy-tests.mjs has the per-test / per-file timeouts.
      - name: Legacy tests (tests/, outside vitest)
        id: legacy
        if: ${{ !cancelled() }}
        env:
          BAT_HELPER_LOG_DIR: ${{ runner.temp }}/bat-helper-logs
          BAT_USER_DATA: ${{ runner.temp }}/bat-user-data
        run: npm run test:legacy -- --json "$RUNNER_TEMP/legacy-results.json"

      - name: Summary (passed / failed)
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
        run: |
          node -e '
            const fs = require("fs")
            const [unitFile, legacyFile] = process.argv.slice(1)
            const out = []
            const section = (title, outcome, lines) => {
              const heading = `${title} (${outcome || "not run"})`
              console.log([heading, ...lines].join("\n  "))
              out.push(`### ${heading}`, "", ...lines, "")
            }
            if (fs.existsSync(unitFile)) {
              const r = JSON.parse(fs.readFileSync(unitFile, "utf8"))
              // numTotalTestSuites counts describe blocks too: count files from testResults
              const failedFiles = r.testResults.filter(f => f.status === "failed").length
              section("Unit tests", process.env.UNIT_OUTCOME, [`tests: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests + r.numTodoTests} skipped / ${r.numTotalTests} total; files: ${failedFiles} failed / ${r.testResults.length} total`])
            } else {
              section("Unit tests", process.env.UNIT_OUTCOME, ["no vitest results (the test step did not finish)"])
            }
            if (fs.existsSync(legacyFile)) {
              const r = JSON.parse(fs.readFileSync(legacyFile, "utf8"))
              const lines = [`tests: ${r.tests.passed} passed, ${r.tests.failed} failed, ${r.tests.cancelled} cancelled; files: ${r.failedFiles} failed / ${r.totalFiles} total`, ""]
              for (const f of r.results.filter(x => !x.ok)) {
                const detail = [f.note, ...f.failures].filter(Boolean).join("; ")
                lines.push(`- ❌ ${f.file} (${f.kind})${detail ? ": " + detail : ""}`)
              }
              section("Legacy tests", process.env.LEGACY_OUTCOME, lines)
            } else {
              section("Legacy tests", process.env.LEGACY_OUTCOME, ["no legacy results (the test step did not finish)"])
            }
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n"))
          ' "$RUNNER_TEMP/vitest-results.json" "$RUNNER_TEMP/legacy-results.json"
