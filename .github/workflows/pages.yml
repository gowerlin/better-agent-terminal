name: Pages

# 專案站 https://gowerlin.github.io/better-agent-terminal/（VitePress，原始碼在 site/）
# 頁面直接 include README.md 的版本對照與 release-note.md，所以這兩個檔案變更時也重建。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'release-note.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site
        env:
          # build 時讀 Releases API 取最新 v* 版的下載連結；失敗時退回 releases 列表，不讓 build 失敗
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 死連結檢查（lychee）：只警告、不擋部署，所以不在 deploy 的 needs 裡，失敗也不讓 workflow 變紅。
  # 站內死連結在 build 時已由 VitePress 擋下（預設遇到死連結 build 失敗）；這裡多抓的是外部連結與
  # 靜態資源，外部網站的暫時性失敗（逾時、速率限制、對方改版）不該讓已經 build 好的網站發不出去。
  # 結果看 job summary 與 warning annotation。設定在 site/lychee.toml。
  link-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # 站內連結是 /better-agent-terminal/<頁面>，所以把 dist 放到同名子目錄、以上一層當 --root-dir
      - name: Unpack site
        run: |
          mkdir -p _lychee/better-agent-terminal
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C _lychee/better-agent-terminal

      # https://github.com/lycheeverse/lychee-action/releases/tag/v2.9.0（2026-07-09，內建 lychee v0.24.2）
      # token 預設是 github.token，GitHub 連結因此不受匿名速率限制
      - id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config site/lychee.toml
            --root-dir ${{ github.workspace }}/_lychee
            --no-progress
            '_lychee/better-agent-terminal/**/*.html'
          fail: false
          failIfEmpty: false

      - name: Warn on broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: echo "::warning title=Broken links::lychee exit code ${{ steps.lychee.outputs.exit_code }}; see the job summary for the list."
