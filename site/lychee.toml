# 網站死連結檢查設定（.github/workflows/pages.yml 的 link-check job 使用）。
#
# dist 的站內連結是 /better-agent-terminal/<頁面>（base + cleanUrls，沒有 .html）。
# job 把 build 產物（site/.vitepress/dist）解到 _lychee/better-agent-terminal/，再以
# --root-dir <絕對路徑>/_lychee 執行；root_dir 必須是絕對路徑，所以放在指令列，不寫在這裡。

# cleanUrls：/better-agent-terminal/cases → cases.html；/better-agent-terminal/remote/ → remote/index.html
fallback_extensions = ["html"]
index_files = ["index.html"]

# GitHub 連結偶爾回 429（速率限制）；job 會帶 GITHUB_TOKEN，429 仍不算死連結
accept = ["200..=299", "429"]
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16

exclude_loopback = true
